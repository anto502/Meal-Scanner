name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Test JS bundle (real error shows here)
        run: npx expo export --platform android --output-dir /tmp/bundle-test

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      - name: Print SHA-1 fingerprint (for Google Sign-In)
        run: |
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1 || true

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealScanner-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
