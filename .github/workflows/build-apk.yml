name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Test JS bundle
        run: npx expo export --platform android --output-dir ./bundle-test

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon > ../gradle-output.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "=========================================="
            echo "   BUILD ERROR DETAILS (copy this part)   "
            echo "=========================================="
            grep -n -B 40 "FAILED" ../gradle-output.log | head -80 || true
            echo "---------- WHAT WENT WRONG ----------"
            grep -n -A 20 "What went wrong" ../gradle-output.log || true
            echo "---------- ERROR LINES ----------"
            grep -n -i -B 3 -A 15 -E "error:|SyntaxError|Unable to resolve|heap out of memory" ../gradle-output.log | head -100 || true
            exit 1
          fi
          echo "APK build OK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MealScanner-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
